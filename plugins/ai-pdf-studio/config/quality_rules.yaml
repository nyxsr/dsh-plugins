# Diagnostic quality scoring and release rules.
weights:
  content: 0.25
  layout: 0.25
  typography: 0.15
  visual: 0.15
  brand: 0.10
  technical: 0.10
mandatory_gates:
  - file_valid
  - page_geometry
  - text_searchable
  - content_complete
  - fonts_embedded
  - no_critical_clipping
  - no_critical_collisions
  - no_unexpected_blank_pages
  - layout_audit
  - no_javascript
thresholds:
  approved_score: 90
  needs_review_score: 85
  maximum_repair_iterations: 3
  minimum_content_completeness: 0.995
  minimum_body_contrast: 4.5
  minimum_body_font_pt: 8.5
  maximum_ink_ratio: 0.42
  minimum_body_margin_pt: 30
  maximum_ink_variance: 0.02
release:
  block_on_critical: true
  block_on_failed_gate: true
  allow_approved_with_warnings: true
  warnings_do_not_override_gates: true
